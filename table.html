
<!DOCTYPE html>
<html>
<head>
    <title>Class Time Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }

        .break {
            background-color: lightyellow;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2 align="center">CLASS TIME TABLE</h2>

    <table>
        <tr>
            <th>Day</th>
            <th>9:00-10:00</th>
            <th>10:00-11:00</th>
            <th>11:00-11:15</th>
            <th>11:15-12:15</th>
            <th>12:15-1:00</th>
            <th>1:00-2:00</th>
        </tr>

        <tr>
            <td>Monday</td>
            <td>English</td>
            <td>Maths</td>
            <td class="break" rowspan="5">Break</td>
            <td>Computer</td>
            <td class="break" rowspan="5">Lunch</td>
            <td>Science</td>
        </tr>

        <tr>
            <td>Tuesday</td>
            <td>Maths</td>
            <td>Science</td>
            <td>English</td>
            <td>Computer</td>
        </tr>

        <tr>
            <td>Wednesday</td>
            <td>Computer</td>
            <td>English</td>
            <td>Maths</td>
            <td>Science</td>
        </tr>

        <tr>
            <td>Thursday</td>
            <td>Science</td>
            <td>Computer</td>
            <td>English</td>
            <td>Maths</td>
        </tr>

        <tr>
            <td>Friday</td>
            <td>English</td>
            <td>Maths</td>
            <td>Science</td>
            <td>Computer</td>
        </tr>
    </table>

</body>
</html>
